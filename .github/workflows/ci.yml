name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install librosa mir_eval numpy scipy torch torchvision torchaudio

      - name: Run Mini-Benchmark
        id: benchmark
        working-directory: backend
        run: |
          set -o pipefail
          python benchmark/mini_benchmark.py | tee benchmark_output.txt

      - name: Comment PR
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const path = require('path');
            let output = 'No output generated.';
            try {
              output = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'backend', 'benchmark_output.txt'), 'utf8');
            } catch(e) {
              console.log('Could not read output file:', e);
            }
            
            const isSuccess = '${{ job.status }}' === 'success';
            const icon = isSuccess ? '✅' : '❌';
            const title = `### ${icon} Mini-Benchmark Results`;
            const body = `${title}\n\n<details>\n<summary>Click to expand benchmark output</summary>\n\n\`\`\`text\n${output}\n\`\`\`\n</details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
